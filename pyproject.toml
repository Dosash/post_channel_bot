[project]
name = "post-channel-bot"
version = "2.6.0"
description = "Telegram-бот и веб-панель для публикации постов в свои каналы: Markdown, медиа, цветные кнопки, контент-план, статистика"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false
